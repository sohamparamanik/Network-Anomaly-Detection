<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Anomaly Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <header>
            <div class="logo">
                <div class="pulse"></div>
                <h1>NetGuard AI</h1>
            </div>
            <div class="server-status">
                <span class="status-dot"></span> System Online
            </div>
        </header>

        <main>
            <section class="controls">
                <div class="card glass">
                    <h2>Traffic Simulation</h2>
                    <p>Generate synthetic traffic examples to test the Isolation Forest model.</p>
                    <div class="button-group">
                        <button id="btn-normal" class="btn primary">Simulate Normal Traffic</button>
                        <button id="btn-anomaly" class="btn danger">Simulate Anomaly-like Traffic</button>
                    </div>
                </div>
                
                <div class="card glass stats-card">
                    <div class="stat">
                        <h3>Total Scanned</h3>
                        <p id="total-scanned">0</p>
                    </div>
                    <div class="stat">
                        <h3>Anomalies Detected</h3>
                        <p id="total-anomalies" class="text-danger">0</p>
                    </div>
                </div>
            </section>

            <section class="results">
                <div class="card glass">
                    <h2>Live Traffic Log</h2>
                    <div class="table-container">
                        <table id="traffic-table">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Protocol</th>
                                    <th>Service</th>
                                    <th>Src Bytes</th>
                                    <th>Dst Bytes</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="traffic-body">
                                <!-- Dynamic rows go here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
